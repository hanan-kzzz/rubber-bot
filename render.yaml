services:
  - type: web
    name: rubber-business-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: ALLOWED_STAFF_IDS
        sync: false
      - key: GOOGLE_SCRIPT_URL
        sync: false
      - key: GOOGLE_SCRIPT_SECRET
        sync: false
